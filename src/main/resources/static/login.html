<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion — mgw prod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<div class="cabinet">
  <div class="auth">

    <a class="wordmark auth-logo" href="challenges.html"><b>MGW</b>PROD</a>

    <div class="auth-box">
      <div>
        <span class="eyebrow">Acceso</span>
        <h1 class="title">Iniciar sesion</h1>
        </div>

      <form class="form" id="login-form">
          <div class="message" id="message" hidden></div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="password">Contrasena</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>

          <button class="btn btn--primary btn--block" type="submit" id="submit">Entrar</button>

          <p class="hint">No tenes cuenta? <a href="register.html">Registrate</a></p>
      </form>
    </div>

    <div class="auth-band" id="band" aria-hidden="true"></div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('login-form');
  const message = document.getElementById('message');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideMessage(message);
    setLoading(submit, true, 'Entrar');

    try {
      const session = await apiFetch('/api/auth/login', {
        method: 'POST',
        auth: false,
        body: {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        }
      });
      saveSession(session);
      window.location.href = 'challenges.html';
    } catch (error) {
      setLoading(submit, false, 'Entrar');
      // El unico error posible aca es credenciales que no coinciden.
      showError(message, error.message === 'Necesitas iniciar sesion.'
        ? 'Email o contrasena incorrectos.'
        : error.message);
    }
  });

  fillBand(document.getElementById('band'), 150, 0);
</script>

</body>
</html>
