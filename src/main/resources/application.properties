spring.application.name=mgw-prod
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mgw_prod
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Esquema manual (docs/db/schema.sql) — Hibernate no crea/modifica tablas.
# Convención confirmada en Clase 4 (2026-08-27, "Arquitectura Spring").
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate re-validates the Default Bean Validation group on every persist/update
# lifecycle event by default, independent of controller-level @Valid. This breaks
# any save() on a User loaded via findById, since User.password is @Transient
# (no DB column) and carries @NotBlank — always null on a loaded entity. Controller
# @Valid @RequestBody already validates every request at the API boundary, so this
# redundant persistence-layer pass is disabled.
spring.jpa.properties.jakarta.persistence.validation.mode=none
