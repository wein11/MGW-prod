spring.application.name=mgw-prod
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mgw_prod
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las tablas se crean a mano con docs/db/schema.sql: Hibernate no crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las validaciones las hacemos con if en los controllers, así que se apaga la
# validación automática que Hibernate intenta hacer al guardar una entidad.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Los archivos estaticos de Etapa 2 se sirven sin cachear: durante el desarrollo
# el navegador se quedaba con el CSS viejo y la pagina se veia rota aunque el
# servidor ya mandara el nuevo. Sin esta linea no hay cabecera Cache-Control y
# cada navegador decide por su cuenta cuanto guardarlo.
spring.web.resources.cache.period=0
