# Config solo de tests. Reemplaza el datasource MySQL de src/main por una base H2
# en memoria (modo MySQL) para que los @DataJpaTest corran sin un servidor real.
# A diferencia de producción (ddl-auto=none + docs/db/schema.sql cargado a mano),
# acá dejamos que Hibernate cree el esquema desde las entidades (create-drop) para
# que cada repository test arranque con las tablas ya listas y se limpien al final.
spring.datasource.url=jdbc:h2:mem:mgw_prod_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mismo motivo que en src/main: la validación Bean Validation en el ciclo de
# persistencia rompe cualquier save() de un User cargado (password @Transient y
# @NotBlank). El @Valid del controller ya valida en el borde de la API.
spring.jpa.properties.jakarta.persistence.validation.mode=none
